<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P6_display_flex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=BBH+Hegarty&family=Bebas+Neue&family=Birthstone&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Lavishly+Yours&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Oswald:wght@200..700&family=Qwitcher+Grypen:wght@400;700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Rubik+Glitch&display=swap" rel="stylesheet">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: 0;
        }
        :root{
            --primary-color: #d900ff;
            --secundary-color: #f2ff00;
            --terciary-color: #00f2ff;
        }

        .bbh-hegarty-regular {
        font-family: "BBH Hegarty", sans-serif;
        font-weight: 400;
         font-style: normal;
        }

        .container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
        }
        
        #amarillo {
            display: flex;
            flex: 1;
            flex-direction: column;
            width: 100%;
            height: 100%;            
            background-color: var(--primary-color);
        }
        #amarillo div{
            display: flex;
            flex: 1;
            }
        div:first-child {
            display: flex;
            align-items: flex-end;
          }

        div:last-child {
            display: flex;
            justify-content:end;
            align-items:center;
        }
        #amarillo {
            display: flex;
            flex: 1;
            width: 100%;
            height: 100%;             
            background-color: var(--secundary-color);
        }
        #morado {
            display: flex;
            flex: 1;
            width: 100%;
            height: 100%;             
            background-color: var(--primary-color);
        }
        #azul {
            display: flex;
            flex: 1;
            width: 100%;
            height: 100%;             
            background-color: var(--terciary-color);
        }
        @media (max-width:600px) {
            .container {
                flex-direction: column;
            }
            }


    </style>
</head>
<body>
    <div class="container">
         <div id="morado">
        </div>
        <div id="amarillo" class="bbh-hegarty-regular " >
            <div>
                <h1>Maria</h1>
            </div>
            <div>
                <h1><a href="https://www.figma.com/design/LhTo74gRwYp82J9QEco0cV/Sin-t%C3%ADtulo?node-id=0-1&t=SkG9TdxpeE7eVECc-1">Fort</a></h1>
            </div>
        </div>
        <div id="azul">
        </div>
    </div>
</body>
</html>
